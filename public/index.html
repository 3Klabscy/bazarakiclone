<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amesi Agora — Cyprus classifieds</title>
  <meta name="description" content="Buy and sell property, cars, electronics and more across Cyprus.">
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="/" class="logo" data-link aria-label="Amesi Agora home">
        <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#fff"/>
          <path d="M17 51 L32 13 L47 51" fill="none" stroke="#1d4e89" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19.5 30 H44.5 V35.5 a4.17 4.17 0 0 1 -8.33 0 a4.17 4.17 0 0 1 -8.34 0 a4.17 4.17 0 0 1 -8.33 0 Z" fill="#d9822b"/>
        </svg>
        <span>amesi <span class="logo-light">agora</span></span>
      </a>
      <form class="search" id="search-form" role="search">
        <input type="search" name="q" placeholder="Search for anything…" aria-label="Search ads">
        <select name="city" aria-label="City"><option value="">All Cyprus</option></select>
        <button type="submit">Search</button>
      </form>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>
  <main class="wrap" id="app" aria-live="polite"></main>
  <footer class="footer">
    <div class="wrap">
      <p><strong>Amesi Agora</strong> · Free classifieds across Nicosia, Limassol, Larnaca, Paphos and Famagusta.</p>
      <p class="muted">Never send money in advance to sellers you have not met. Meet in a public place.</p>
    </div>
  </footer>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
