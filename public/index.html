<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amesi Agora — Cyprus classifieds</title>
  <meta name="description" content="Buy and sell property, cars, electronics and more across Cyprus.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d4e89'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>A</text></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="/" class="logo" data-link><span class="logo-mark">A</span>amesi agora</a>
      <form class="search" id="search-form" role="search">
        <input type="search" name="q" placeholder="Search for anything…" aria-label="Search ads">
        <select name="city" aria-label="City"><option value="">All Cyprus</option></select>
        <button type="submit">Search</button>
      </form>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>
  <main class="wrap" id="app" aria-live="polite"></main>
  <footer class="footer">
    <div class="wrap">
      <p><strong>Amesi Agora</strong> · Free classifieds across Nicosia, Limassol, Larnaca, Paphos and Famagusta.</p>
      <p class="muted">Never send money in advance to sellers you have not met. Meet in a public place.</p>
    </div>
  </footer>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
